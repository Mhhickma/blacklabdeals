name: Render static deal pages now

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/render-static-pages.txt'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render static deal cards
        run: python render_homepage_static_deals.py

      - name: Commit, push, and deploy static deal pages
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f *.html || true
          git add -f */index.html || true
          git status
          if git diff --staged --quiet; then
            echo "No static page changes to commit"
          else
            git commit -m "Render static deal cards across pages"
            git push origin main
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered Vercel deploy hook"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
          fi
