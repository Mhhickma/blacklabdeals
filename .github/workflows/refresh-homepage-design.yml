name: Refresh homepage design

on:
  push:
    paths:
      - '.github/workflows/refresh-homepage-design.yml'
      - 'refresh_homepage_design.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage
        run: python refresh_homepage_design.py
      - name: Commit homepage refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh homepage design"
          git push
