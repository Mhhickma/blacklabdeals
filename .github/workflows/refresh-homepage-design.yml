name: Refresh homepage design

on:
  push:
    paths:
      - '.github/workflows/refresh-homepage-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh homepage
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('index.html')
          s=path.read_text(encoding='utf-8')
          css='''/* BLD HOMEPAGE REFRESH 2026 */
          .home-hero-refresh{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:26px;align-items:stretch;padding:34px 0 24px}.hero-copy-refresh{border:1px solid #d9e2eb;border-radius:24px;background:linear-gradient(135deg,#ffffff 0%,#eef4fa 100%);box-shadow:0 10px 28px rgba(26,58,92,.09);padding:30px}.hero-kicker-refresh{display:inline-flex;align-items:center;border:1px solid #bfd3e6;border-radius:999px;background:#fff;color:#1a3a5c;padding:6px 12px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}.hero-copy-refresh h1{font:700 clamp(36px,5vw,64px)/1.02 Georgia,serif;letter-spacing:-.8px;margin:0 0 12px;color:#1a1a18}.hero-copy-refresh p{max-width:680px;color:#4f4f49;font-size:16px;line-height:1.7;margin:0 0 16px}.hero-actions-refresh{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 14px}.home-cta-primary,.home-cta-secondary{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 18px;font-weight:900;text-decoration:none}.home-cta-primary{background:#1a3a5c;color:#fff}.home-cta-secondary{border:1px solid #bfd3e6;background:#fff;color:#1a3a5c}.affiliate-mini-refresh{font-size:12px!important;color:#6b6b65!important;margin:8px 0 0!important}.hero-card-refresh{display:flex;flex-direction:column;gap:14px;border:1px solid #d9e2eb;border-radius:24px;background:#fff;padding:22px;box-shadow:0 10px 28px rgba(26,58,92,.08)}.hero-logo-row{display:flex;align-items:center;gap:14px}.hero-logo-row img{width:78px;height:78px;border-radius:18px;object-fit:contain;background:#f9f8f5;border:1px solid #e8e6e1;padding:8px}.hero-logo-row h2{font:700 25px/1.15 Georgia,serif;margin:0}.hero-logo-row p{margin:4px 0 0;color:#6b6b65;font-size:13px}.hero-card-refresh .hero-pill{margin:0;background:#fff3d4;border-color:#e8c96a;color:#7a5200;width:max-content}.hero-checklist{display:grid;gap:9px;margin:0;padding:0;list-style:none}.hero-checklist li{border:1px solid #e8e6e1;border-radius:12px;background:#f9f8f5;padding:10px 12px;color:#263b50;font-weight:800;font-size:13px}.trust-strip-refresh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 26px}.trust-card-refresh{border:1px solid #e8e6e1;border-radius:18px;background:#fff;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.trust-card-refresh strong{display:block;color:#1a3a5c;font-size:20px;line-height:1.1;margin-bottom:6px}.trust-card-refresh span{display:block;color:#595954;font-size:13px;line-height:1.5}.featured-paths-refresh{margin:0 0 28px}.featured-paths-head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:12px}.featured-paths-head h2{font:700 30px/1.15 Georgia,serif;margin:0}.featured-paths-head p{margin:0;color:#6b6b65;font-size:13px}.featured-paths-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.featured-path-card{display:block;border:1px solid #d9e2eb;border-radius:18px;background:#fff;color:inherit;text-decoration:none;padding:18px;box-shadow:0 5px 18px rgba(0,0,0,.04);transition:transform .16s,box-shadow .16s,border-color .16s}.featured-path-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(26,58,92,.1);border-color:#bfd3e6}.featured-path-card small{display:inline-flex;border-radius:999px;background:#e8eef5;color:#1a3a5c;padding:4px 9px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}.featured-path-card h3{margin:0 0 6px;font-size:18px;color:#1a1a18}.featured-path-card p{margin:0;color:#595954;font-size:13px;line-height:1.55}@media(max-width:900px){.home-hero-refresh{grid-template-columns:1fr;padding-top:22px}.trust-strip-refresh,.featured-paths-grid{grid-template-columns:1fr}.featured-paths-head{display:block}.featured-paths-head h2{font-size:25px;margin-bottom:4px}}@media(max-width:600px){.hero-copy-refresh,.hero-card-refresh{border-radius:18px;padding:18px}.hero-copy-refresh h1{font-size:36px}.hero-actions-refresh a{width:100%}.hero-logo-row img{width:62px;height:62px}.trust-card-refresh,.featured-path-card{padding:15px}}
          '''
          if '/* BLD HOMEPAGE REFRESH 2026 */' not in s:
              s=s.replace('</style>', css+'</style>', 1)
          main='''<main class="page-shell">
  <section class="home-hero-refresh" aria-labelledby="home-hero-title">
    <div class="hero-copy-refresh">
      <div class="hero-kicker-refresh">Black Lab Deals</div>
      <h1 id="home-hero-title">Amazon product picks without the endless scrolling.</h1>
      <p>Browse organized Amazon product finds, sale-event lists, and current picks built to help you compare faster and confirm the final details directly on Amazon.</p>
      <div class="hero-actions-refresh">
        <a class="home-cta-primary" href="/amazon-sale-deals/">Browse Amazon sale deals</a>
        <a class="home-cta-secondary" href="#current-picks">See current picks</a>
      </div>
      <p class="affiliate-mini-refresh">As an Amazon Associate, Black Lab Deals may earn from qualifying purchases.</p>
    </div>
    <aside class="hero-card-refresh" aria-label="Why use Black Lab Deals">
      <div class="hero-logo-row">
        <img src="/logo-384.png" alt="Black Lab Deals logo" loading="eager" decoding="async">
        <div><h2>Deal browsing made simpler</h2><p>Curated categories, cleaner browsing, and direct Amazon checks.</p></div>
      </div>
      <div class="hero-pill" id="hero-pill">Loading current product picks...</div>
      <ul class="hero-checklist">
        <li>Sale event pages organized by category and brand</li>
        <li>Current Amazon API pricing shown when available</li>
        <li>Mobile-first browsing for fast deal checks</li>
      </ul>
    </aside>
  </section>
  <section class="trust-strip-refresh" aria-label="Black Lab Deals highlights">
    <div class="trust-card-refresh"><strong>222k+</strong><span>sale-event ASINs organized into a cleaner browsing experience.</span></div>
    <div class="trust-card-refresh"><strong>Amazon API</strong><span>Displayed sale prices come from Amazon API refreshes when available.</span></div>
    <div class="trust-card-refresh"><strong>Mobile ready</strong><span>Category, brand, search, and price filters are designed for quick phone browsing.</span></div>
  </section>
  <section class="featured-paths-refresh" aria-labelledby="featured-paths-title">
    <div class="featured-paths-head"><div><h2 id="featured-paths-title">Start with the right list</h2><p>Jump into the pages shoppers are most likely to use during sale events.</p></div></div>
    <div class="featured-paths-grid">
      <a class="featured-path-card" href="/amazon-sale-deals/"><small>Sale event</small><h3>Amazon Sale Deals</h3><p>Browse the larger sale catalog by category, brand, search, and current Amazon price filters.</p></a>
      <a class="featured-path-card" href="/top-100-amazon-deals-today/"><small>Quick browse</small><h3>Top 100 Product Picks</h3><p>A faster page for shoppers who want a shorter list of current product picks.</p></a>
      <a class="featured-path-card" href="/best-amazon-tool-deals/"><small>Category</small><h3>Tool Product Picks</h3><p>Jump straight into tool-related Amazon product picks and compare options quickly.</p></a>
    </div>
  </section>
  <section class="hot-strip" id="current-picks"><div class="section-head"><h2>Current Amazon Product Picks</h2><div class="deal-count" id="deal-count">Loading</div></div><div class="status-line" id="status-line">Loading current product picks...</div><div class="hot-grid" id="hot-grid" aria-live="polite"></div></section>
  <section class="seo-content"><h2>Helpful Shopping Guidance</h2><p>Use the category shortcuts to narrow the product list, then review the current product information before visiting Amazon. Prices, coupons, and availability can change quickly, so always confirm final details directly on Amazon.</p></section>
</main>'''
          s=re.sub(r'<main class="page-shell">.*?</main>', main, s, count=1, flags=re.S)
          path.write_text(s,encoding='utf-8')
      - name: Commit homepage refresh
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh homepage design"
          git push
