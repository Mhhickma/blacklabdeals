name: Patch homepage popup loader

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-homepage-popup-loader.yml

permissions:
  contents: write

jobs:
  patch-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert homepage popup script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8-sig')
          script = '<script src="/homepage-email-popup.js?v=2" defer></script>'
          if script not in html:
              if '</body>' not in html:
                  raise SystemExit('Missing closing body tag')
              html = html.replace('</body>', script + '</body>', 1)
              path.write_text(html, encoding='utf-8')
          PY
      - name: Commit change if needed
        run: |
          if git diff --quiet; then
            echo "Homepage popup loader already present."
            exit 0
          fi
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add index.html
          git commit -m "Load homepage email popup script"
          git push
