name: Mobile Brand Dropdown
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mobile-brand-dropdown.yml'
permissions:
  contents: write
concurrency:
  group: all-category-brand-filter-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Add mobile brand dropdown
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sale-event-review-7f3k9/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('.brands button.active{background:#1a3a5c;color:#fff}', '.brands button.active{background:#1a3a5c;color:#fff}.brand-mobile{display:none;margin:-5px 0 15px}.brand-mobile select{width:100%;min-width:0;border:1px solid #bfd3e6;border-radius:10px;background:#fff;padding:12px;font:800 14px Arial;color:#1a3a5c}')
          s=s.replace('@media(max-width:619px){.cats{', '@media(max-width:619px){.brands.visible{display:none}.brand-mobile.visible{display:block}.cats{')
          s=s.replace('<nav class="brands" id="brands" aria-label="Product brands"></nav><section class="controls">', '<nav class="brands" id="brands" aria-label="Product brands"></nav><div class="brand-mobile" id="brand-mobile"><select id="brand-select" aria-label="Filter by brand"></select></div><section class="controls">')
          old="function renderBrands(){let data=brandData.categories[current],show=current!=='All Sale Deals'&&data?.brands?.length;$('brands').classList.toggle('visible',!!show);$('brands').innerHTML=show?`<button type=\"button\" class=\"${selectedBrand?'':'active'}\" data-brand=\"\">All ${esc(current)} Brands</button>`+data.brands.map(b=>`<button type=\"button\" class=\"${selectedBrand===b.key?'active':''}\" data-brand=\"${esc(b.key)}\">${esc(b.name)} (${b.count.toLocaleString()})</button>`).join(''):''}"
          new="function renderBrands(){let data=brandData.categories[current],show=current!=='All Sale Deals'&&data?.brands?.length;$('brands').classList.toggle('visible',!!show);$('brand-mobile').classList.toggle('visible',!!show);$('brands').innerHTML=show?`<button type=\"button\" class=\"${selectedBrand?'':'active'}\" data-brand=\"\">All ${esc(current)} Brands</button>`+data.brands.map(b=>`<button type=\"button\" class=\"${selectedBrand===b.key?'active':''}\" data-brand=\"${esc(b.key)}\">${esc(b.name)} (${b.count.toLocaleString()})</button>`).join(''):'';$('brand-select').innerHTML=show?`<option value=\"\">All ${esc(current)} Brands</option>`+data.brands.map(b=>`<option value=\"${esc(b.key)}\" ${selectedBrand===b.key?'selected':''}>${esc(b.name)} (${b.count.toLocaleString()})</option>`).join(''):''}"
          s=s.replace(old,new)
          s=s.replace("$('brands').onclick=e=>{let b=e.target.closest('button');if(!b)return;selectedBrand=b.dataset.brand;renderBrands();apply()};", "$('brands').onclick=e=>{let b=e.target.closest('button');if(!b)return;selectedBrand=b.dataset.brand;renderBrands();apply()};$('brand-select').onchange=e=>{selectedBrand=e.target.value;renderBrands();apply()};")
          if 'id="brand-select"' not in s or "$('brand-select').onchange" not in s: raise SystemExit('Mobile brand dropdown patch failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and deploy mobile brand dropdown
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add sale-event-review-7f3k9/index.html
          git commit -m "Use brand dropdown on mobile sale page"
          git pull --rebase origin main
          git push origin main
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; fi
