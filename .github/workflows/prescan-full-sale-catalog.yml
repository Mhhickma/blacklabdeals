name: Prescan Full Sale Catalog

on:
  schedule:
    - cron: '0 7,19 23-25 6 *'
  workflow_dispatch:
    inputs:
      asins_per_run:
        description: Balanced ASINs to scan and publish in this checkpoint
        required: false
        default: '250000'
  push:
    paths:
      - '.github/triggers/start-sale-prescan.txt'

permissions:
  contents: write
concurrency:
  group: sale-catalog-prescan-writer
  cancel-in-progress: false
jobs:
  prescan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Amazon Creators API dependency
        run: pip install keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run event pricing refresh
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          SALE_EVENT_AFFILIATE_TAG: blacklabdealsprime-20
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          SALE_PRESCAN_ASINS_PER_RUN: ${{ github.event_name == 'schedule' && '250000' || github.event_name == 'push' && '250000' || inputs.asins_per_run || '250000' }}
          SALE_PRESCAN_DAILY_REFRESH: '1'
          SALE_EVENT_REFRESH_WINDOWS: '1'
          SALE_EVENT_REFRESH_START_DATE: '2026-06-23'
          SALE_EVENT_REFRESH_END_DATE: '2026-06-25'
          SALE_EVENT_REFRESH_STOP_AT: '2026-06-26T00:00:00-04:00'
          BEST_SELLER_AMAZON_CONCURRENT_BATCHES: '2'
          BEST_SELLER_AMAZON_REQUEST_DELAY_SECONDS: '1'
        run: python prescan_sale_event_catalog.py
      - name: Publish completed pricing checkpoint immediately
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f sale-event-review-7f3k9/*.json sale_event_prescan_state.json sale_event_prescan_report.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Publish sale catalog pricing checkpoint"
          git pull --rebase origin main
          git push origin main
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; fi
