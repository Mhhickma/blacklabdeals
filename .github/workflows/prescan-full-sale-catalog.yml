name: Prescan Full Sale Catalog

on:
  schedule:
    - cron: '30 12-23 15 6 *'
    - cron: '0 13-23 15 6 *'
  workflow_dispatch:
    inputs:
      asins_per_run:
        description: Balanced ASINs to scan continuously
        required: false
        default: '150000'
  push:
    paths:
      - '.github/triggers/start-sale-prescan.txt'

permissions:
  contents: write
concurrency:
  group: sale-catalog-prescan-writer
  cancel-in-progress: false
jobs:
  prescan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Amazon Creators API dependency
        run: pip install keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Enforce one-time June 15, 2026 full pricing window
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc)
          if now.year!=2026 or now.month!=6 or now.day!=15: raise SystemExit(f'Outside one-time full pricing date: {now.isoformat()}')
          PY
      - name: Run all remaining ASINs continuously at proven launch pace
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          SALE_EVENT_AFFILIATE_TAG: blacklabdealsprime-20
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          SALE_PRESCAN_ASINS_PER_RUN: ${{ inputs.asins_per_run || '150000' }}
          BEST_SELLER_AMAZON_CONCURRENT_BATCHES: '2'
          BEST_SELLER_AMAZON_REQUEST_DELAY_SECONDS: '1'
        run: python prescan_sale_event_catalog.py
      - name: Commit pricing progress and Amazon-approved catalog data
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f sale-event-review-7f3k9/*.json sale_event_prescan_state.json sale_event_prescan_report.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Refresh balanced sale catalog pricing"
          git pull --rebase origin main
          git push origin main
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; fi
