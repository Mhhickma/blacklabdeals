name: Prescan Full Sale Catalog

on:
  schedule:
    - cron: '0,15,30,45 7 18-27 6 *'
  workflow_dispatch:
    inputs:
      asins_per_run:
        description: Balanced ASINs to scan and publish in this checkpoint
        required: false
        default: '25000'
  push:
    paths:
      - '.github/triggers/start-sale-prescan.txt'

permissions:
  contents: write
concurrency:
  group: sale-catalog-prescan-writer
  cancel-in-progress: true
jobs:
  prescan:
    if: ${{ !contains(github.event.head_commit.message, '[stop-prescan]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Amazon Creators API dependency
        run: pip install keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run and publish pricing refresh checkpoints
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          SALE_EVENT_AFFILIATE_TAG: blacklabdealsprime-20
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          SALE_PRESCAN_ASINS_PER_RUN: ${{ inputs.asins_per_run || '25000' }}
          SALE_PRESCAN_DAILY_REFRESH: '1'
          SALE_EVENT_REFRESH_WINDOWS: '1'
          SALE_EVENT_REFRESH_START_DATE: '2026-06-18'
          SALE_EVENT_REFRESH_END_DATE: '2026-06-27'
          SALE_EVENT_REFRESH_STOP_AT: '2026-06-28T00:00:00-04:00'
          BEST_SELLER_AMAZON_CONCURRENT_BATCHES: '2'
          BEST_SELLER_AMAZON_REQUEST_DELAY_SECONDS: '1'
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          for checkpoint in $(seq 1 10); do
            python prescan_sale_event_catalog.py
            git add -f sale-event-review-7f3k9/*.json sale_event_prescan_state.json sale_event_prescan_report.json
            if git diff --staged --quiet; then
              echo "No checkpoint changes to publish"
              break
            fi
            git commit -m "Publish sale catalog pricing checkpoint ${checkpoint}"
            git pull --rebase origin main
            git push origin main
            if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; fi
            if python -c "import json; state=json.load(open('sale_event_prescan_state.json',encoding='utf-8')); raise SystemExit(0 if state.get('complete') else 1)"; then
              echo "Sale catalog prescan is complete"
              break
            fi
          done
