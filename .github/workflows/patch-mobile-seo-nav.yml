name: Patch Mobile SEO Navigation

on:
  workflow_dispatch:
  push:
    paths:
      - patch_mobile_seo_nav.py
      - .github/workflows/patch-mobile-seo-nav.yml
      - patch-mobile-seo-nav.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch mobile SEO navigation
        run: python patch_mobile_seo_nav.py
      - name: Commit mobile navigation updates
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add site-common.js site-common.css index.html
          git status
          if git diff --staged --quiet; then
            echo "No mobile navigation changes to commit"
            exit 0
          fi
          git commit -m "Improve mobile deal navigation"
          git pull --rebase origin main
          git push origin main
