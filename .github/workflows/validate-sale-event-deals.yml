name: Validate Sale Event Deals

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      asins_per_run:
        description: Selected sale ASINs to validate in this run
        required: false
        default: '250'
      import_electronics_asins:
        description: Import this many balanced ASINs from all spreadsheet category tabs before validation
        required: false
        default: '0'
  push:
    paths:
      - '.github/triggers/validate-1000-sale-asins.txt'

permissions:
  contents: write

concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false

jobs:
  validate-sale-event-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Amazon Creators API dependency
        run: pip install keepa numpy python-amazon-paapi

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Import balanced ASIN sample from spreadsheet
        env:
          IMPORT_ASIN_COUNT: ${{ github.event_name == 'push' && '1000' || inputs.import_electronics_asins || '0' }}
        run: |
          python - <<'PY'
          import csv, io, json, os
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          count = int(os.getenv("IMPORT_ASIN_COUNT", "0"))
          if count <= 0:
              raise SystemExit(0)
          sheet_id = "15kLY4nPg-ydq9kcqUcSTrzttQxtCkeXGoU2HoO4KTkc"
          tabs = [
              "Electronics", "Furniture", "Health & Personal Care", "Home",
              "Home Entertainment", "Home Improvement", "Kitchen", "Lawn and Garden",
              "Office Products", "Outdoors", "PC", "Pet Products", "Sports", "Tools",
              "Toys", "Video Devices", "Wireless",
          ]
          base, remainder = divmod(count, len(tabs))
          pools, selected, seen = {}, [], set()
          category_counts = {tab: 0 for tab in tabs}
          for index, tab in enumerate(tabs):
              quota = base + (1 if index < remainder else 0)
              query = quote(f"select A limit {quota + count + 101}")
              url = f"https://docs.google.com/spreadsheets/d/{sheet_id}/gviz/tq?tqx=out:csv&sheet={quote(tab)}&tq={query}"
              text = urlopen(Request(url, headers={"User-Agent": "BlackLabDeals-SaleImport/1.0"}), timeout=180).read().decode("utf-8-sig", errors="replace")
              rows = list(csv.reader(io.StringIO(text)))
              pools[tab] = list(dict.fromkeys(row[0].strip().upper() for row in rows[1:] if row and len(row[0].strip()) == 10))
              for asin in pools[tab]:
                  if category_counts[tab] >= quota:
                      break
                  if asin not in seen:
                      selected.append(asin); seen.add(asin); category_counts[tab] += 1
          while len(selected) < count:
              added = False
              for tab in tabs:
                  for asin in pools[tab]:
                      if asin not in seen:
                          selected.append(asin); seen.add(asin); category_counts[tab] += 1; added = True
                          break
                  if len(selected) >= count:
                      break
              if not added:
                  break
          with open("sale_event_watchlist.json", "w", encoding="utf-8") as handle:
              json.dump({"description": "Balanced sale-event ASIN sample imported from all spreadsheet category tabs.", "categoryCounts": category_counts, "asins": selected}, handle, indent=2)
              handle.write("\n")
          print(f"Imported {len(selected)} balanced ASINs into sale_event_watchlist.json: {category_counts}")
          PY

      - name: Validate selected sale products
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          SALE_EVENT_AFFILIATE_TAG: blacklabdealsprime-20
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          SALE_EVENT_ASINS_PER_RUN: ${{ github.event_name == 'push' && '1000' || inputs.asins_per_run || '250' }}
          BEST_SELLER_AMAZON_CONCURRENT_BATCHES: '1'
          BEST_SELLER_AMAZON_REQUEST_DELAY_SECONDS: '1'
        run: python fetch_sale_event_deals.py

      - name: Commit fresh validated sale products
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f sale_event_watchlist.json sale_event_deals.json sale_event_state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Validate sale event products $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          fi
