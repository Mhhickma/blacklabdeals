name: Validate Sale Event Deals

on:
  workflow_dispatch:
    inputs:
      asins_per_run:
        description: Selected sale ASINs to validate in this run
        required: false
        default: '250'
      import_electronics_asins:
        description: Import this many balanced ASINs from all spreadsheet category tabs before validation
        required: false
        default: '0'
      sample_offset_per_category:
        description: Skip this many ASINs in each category for a fresh test sample
        required: false
        default: '0'
      concurrent_requests:
        description: Concurrent Creator API request workers
        required: false
        default: '1'
  push:
    paths:
      - '.github/triggers/validate-1000-sale-asins.txt'

permissions:
  contents: write

concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false

jobs:
  validate-sale-event-deals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Amazon Creators API dependency
        run: pip install keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Import fresh balanced ASIN sample from spreadsheet
        env:
          IMPORT_ASIN_COUNT: ${{ inputs.import_electronics_asins || '0' }}
          IMPORT_OFFSET_PER_CATEGORY: ${{ inputs.sample_offset_per_category || '0' }}
        run: |
          python - <<'PY'
          import csv, io, json, os
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          count=int(os.getenv('IMPORT_ASIN_COUNT','0')); offset=int(os.getenv('IMPORT_OFFSET_PER_CATEGORY','0'))
          if count<=0: raise SystemExit(0)
          tabs=['Electronics','Furniture','Health & Personal Care','Home','Home Entertainment','Home Improvement','Kitchen','Lawn and Garden','Office Products','Outdoors','PC','Pet Products','Sports','Tools','Toys','Video Devices','Wireless']; sheet='15kLY4nPg-ydq9kcqUcSTrzttQxtCkeXGoU2HoO4KTkc'
          base,rem=divmod(count,len(tabs)); selected=[]; seen=set(); counts={t:0 for t in tabs}
          for i,tab in enumerate(tabs):
              quota=base+(i<rem); url=f'https://docs.google.com/spreadsheets/d/{sheet}/gviz/tq?tqx=out:csv&sheet={quote(tab)}&tq={quote(f"select A limit {offset+quota+101}")}'
              rows=list(csv.reader(io.StringIO(urlopen(Request(url,headers={'User-Agent':'BlackLabDeals-Test/1.0'}),timeout=180).read().decode('utf-8-sig',errors='replace')))); pool=list(dict.fromkeys(r[0].strip().upper() for r in rows[1:] if r and len(r[0].strip())==10))[offset:]
              for asin in pool[:quota]:
                  if asin not in seen: selected.append(asin); seen.add(asin); counts[tab]+=1
          json.dump({'description':'Manual balanced test sample.','categoryCounts':counts,'asins':selected},open('sale_event_watchlist.json','w',encoding='utf-8'),indent=2)
          PY
      - name: Validate selected sale products
        env:
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
          SALE_EVENT_AFFILIATE_TAG: blacklabdealsprime-20
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          SALE_EVENT_ASINS_PER_RUN: ${{ inputs.asins_per_run || '250' }}
          BEST_SELLER_AMAZON_CONCURRENT_BATCHES: ${{ inputs.concurrent_requests || '1' }}
          BEST_SELLER_AMAZON_REQUEST_DELAY_SECONDS: '1'
        run: python fetch_sale_event_deals.py
      - name: Commit manual test results
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f sale_event_watchlist.json sale_event_deals.json sale_event_state.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Validate manual sale event sample"
          git push origin main
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; fi
