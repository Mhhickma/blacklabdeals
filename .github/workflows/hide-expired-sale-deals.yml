name: Hide expired sale deals

on:
  push:
    paths:
      - '.github/workflows/hide-expired-sale-deals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide expired deals on sale page
        shell: python
        run: |
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')
          if 'function dealActive(p)' not in s:
              marker='function apply(){'
              helper="function dealActive(p){let t=Date.parse(p.endsAt||'');return !Number.isFinite(t)||Date.now()<t}"
              if marker not in s:
                  raise SystemExit('apply function marker not found')
              s=s.replace(marker, helper+marker, 1)
          old="shown=products.filter(p=>{let brandMatch="
          new="shown=products.filter(p=>{if(!dealActive(p))return false;let brandMatch="
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('product filter marker not found')
          path.write_text(s,encoding='utf-8')
      - name: Commit expired deal filter
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Hide expired sale event deals"
          git push
