name: Update Meta Pixel ID

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-meta-pixel-id.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meta-pixel-id:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace old Meta Pixel ID
        run: |
          python - <<'PY'
          from pathlib import Path

          old_id = '524610261690867'
          new_id = '1642712089209011'
          extensions = {'.html', '.htm', '.js'}
          changed = []

          for path in Path('.').rglob('*'):
              if '.git' in path.parts or path.is_dir() or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_id, new_id)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if changed:
              print('Updated Meta Pixel ID in:')
              for item in changed:
                  print(f' - {item}')
          else:
              print('No files contained the old Meta Pixel ID.')
          PY

      - name: Commit replacement
        run: |
          if git diff --quiet; then
            echo "No Meta Pixel ID changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update Meta Pixel ID"
          git push
