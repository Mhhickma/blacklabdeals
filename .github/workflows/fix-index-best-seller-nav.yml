name: Fix Index Best Seller Nav
on:
  push:
    paths:
      - '.github/workflows/fix-index-best-seller-nav.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fix-index-best-seller-nav
  cancel-in-progress: true
jobs:
  fix-index-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Best Seller Deals to index category menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'Best Seller Deals' in text:
              print('Best Seller Deals already exists in index.html')
          else:
              changed = False

              def make_best_seller_item(item: str) -> str:
                  new = item
                  new = re.sub(r'href=("|\')[^"\']*("|\')', 'href="/best-seller-deals.html"', new, count=1)
                  new = re.sub(r'(onclick=("|\'))[^"\']*("|\')', r'\1window.location.href=\'/best-seller-deals.html\'; return false;\3', new, count=1)
                  new = re.sub(r'(data-[a-zA-Z0-9_-]+=("|\'))[^"\']*("|\')', r'\1best-seller-deals\3', new, count=1)
                  new = new.replace('Top 100 Deals', 'Best Seller Deals')
                  new = new.replace('🔥', '🏆', 1)
                  return new

              # Preferred: duplicate the existing Top 100 Deals menu item and change link/text/icon.
              patterns = [
                  r'(?P<item><a\b[^>]*>[\s\S]*?Top 100 Deals[\s\S]*?</a>)',
                  r'(?P<item><button\b[^>]*>[\s\S]*?Top 100 Deals[\s\S]*?</button>)',
                  r'(?P<item><div\b[^>]*>[\s\S]*?Top 100 Deals[\s\S]*?</div>)',
              ]

              for pattern in patterns:
                  match = re.search(pattern, text)
                  if match:
                      item = match.group('item')
                      insert = item + '\n' + make_best_seller_item(item)
                      text = text[:match.start('item')] + insert + text[match.end('item'):]
                      changed = True
                      print('Inserted Best Seller Deals by duplicating Top 100 Deals item')
                      break

              # Fallback for one-line menu items.
              if not changed:
                  lines = text.splitlines(keepends=True)
                  for i, line in enumerate(lines):
                      if 'Top 100 Deals' in line:
                          lines.insert(i + 1, make_best_seller_item(line))
                          text = ''.join(lines)
                          changed = True
                          print('Inserted Best Seller Deals after Top 100 Deals line')
                          break

              if not changed:
                  raise SystemExit('Could not find Top 100 Deals in index.html')

              path.write_text(text, encoding='utf-8')

          # Also apply the compliance copy fixes while touching index.
          replacements = {
              'Top Amazon discounts across every category — updated every 30 minutes automatically.': 'Top deals found on Amazon across every category — updated every 30 minutes automatically.',
              'Top Amazon discounts across every category - updated every 30 minutes automatically.': 'Top deals found on Amazon across every category - updated every 30 minutes automatically.',
              'Updated every 30 minutes · Powered by live Amazon data': 'Updated every 30 minutes · Deal data refreshed regularly',
              'Updated every 30 minutes &middot; Powered by live Amazon data': 'Updated every 30 minutes &middot; Deal data refreshed regularly',
              'Updated every 30 minutes • Powered by live Amazon data': 'Updated every 30 minutes • Deal data refreshed regularly',
              'Updated every 30 minutes - Powered by live Amazon data': 'Updated every 30 minutes - Deal data refreshed regularly',
              'Prices sourced live from Amazon.': 'Prices and availability are checked at time of posting and may change.',
              'As an Amazon Associate we earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
              'As an Amazon Associate I earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
          }
          text = path.read_text(encoding='utf-8')
          original = text
          for old, new in replacements.items():
              text = text.replace(old, new)
          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Applied compliance copy fixes in index.html')
          PY
      - name: Commit index update
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f index.html
          git status
          if git diff --staged --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "Add Best Seller Deals to main nav menu"
          git push origin main
