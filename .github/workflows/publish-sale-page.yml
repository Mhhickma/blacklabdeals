name: Publish sale page publicly

on:
  push:
    paths:
      - '.github/workflows/publish-sale-page.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make sale page public and indexable
        shell: python
        run: |
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')
          s=s.replace('<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">','<meta name="robots" content="index,follow,max-image-preview:large">')
          s=s.replace('<title>Amazon Sale Event Preview | Black Lab Deals</title>','<title>Amazon Sale Event Deals | Black Lab Deals</title>')
          s=s.replace('<strong>Hidden review page:</strong> Only products with a current price returned by the Amazon Creators API are displayed.','<strong>Live sale deals:</strong> Only products with a current price returned by the Amazon Creators API are displayed.')
          path.write_text(s,encoding='utf-8')

          sitemap=Path('sitemap.xml')
          if sitemap.exists():
              x=sitemap.read_text(encoding='utf-8')
              url='https://blacklabdeals.com/sale-event-review-7f3k9/'
              if url not in x:
                  entry=f'  <url><loc>{url}</loc><changefreq>hourly</changefreq><priority>0.9</priority></url>\n'
                  x=x.replace('</urlset>',entry+'</urlset>')
                  sitemap.write_text(x,encoding='utf-8')
      - name: Commit public page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html sitemap.xml
          git diff --cached --quiet || git commit -m "Publish sale event page"
          git push
