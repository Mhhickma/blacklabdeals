name: Keepa Enrich Google Sheet

on:
  workflow_dispatch:
    inputs:
      tabs:
        description: 'Comma-separated tabs to enrich, or all'
        required: true
        default: 'Tools'
      limit:
        description: 'Number of ASIN rows to test per tab'
        required: true
        default: '20'
      start_row:
        description: 'First data row to process'
        required: true
        default: '2'
      dry_run:
        description: 'Preview only; do not write to Google Sheet'
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  keepa-enrich-sheet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests gspread google-auth

      - name: Enrich Google Sheet with Keepa data
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AMAZON_SALES_EVENT_SHEET_ID: 15kLY4nPg-ydq9kcqUcSTrzttQxtCkeXGoU2HoO4KTkc
          KEEPA_TABS: ${{ github.event.inputs.tabs }}
          KEEPA_LIMIT: ${{ github.event.inputs.limit }}
          KEEPA_START_ROW: ${{ github.event.inputs.start_row }}
          KEEPA_DRY_RUN: ${{ github.event.inputs.dry_run }}
          KEEPA_DOMAIN: 1
          KEEPA_STATS_DAYS: 90
          KEEPA_BATCH_SIZE: 10
        run: python scripts/keepa_enrich_google_sheet.py
