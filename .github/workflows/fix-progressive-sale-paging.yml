name: Fix progressive sale paging

on:
  push:
    paths:
      - '.github/workflows/fix-progressive-sale-paging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix progressive paging
        shell: python
        run: |
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')
          old="async function loadNextAll(){if(allLoading||!allHasMore)return;allLoading=true;$('count').textContent='Loading more verified-price products...';let chunk=await fetch(allFiles[allFileIndex++]).then(r=>r.json());products=[...new Map([...products,...chunk].map(p=>[p.asin,p])).values()];allHasMore=allFileIndex<allFiles.length;allLoading=false;apply()}"
          new="async function loadNextAll(advance=false){if(allLoading||!allHasMore)return;let oldPage=page;allLoading=true;$('count').textContent='Loading more verified-price products...';let chunk=await fetch(allFiles[allFileIndex++]).then(r=>r.json());products=[...new Map([...products,...chunk].map(p=>[p.asin,p])).values()];allHasMore=allFileIndex<allFiles.length;allLoading=false;apply();if(advance){page=oldPage+1;render()}}"
          if old not in s: raise SystemExit('progressive loader pattern not found')
          s=s.replace(old,new)
          s=s.replace("if(page>=total&&allHasMore){await loadNextAll()}","if(page>=total&&allHasMore){await loadNextAll(true)}")
          path.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Fix progressive All Deals paging"
          git push
