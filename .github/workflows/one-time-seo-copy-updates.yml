name: One-time sitewide SEO optimization

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Optimize page SEO copy, metadata, schema, and trust content
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import json
          import re

          SITE = "https://blacklabdeals.com"
          BRAND = "Black Lab Deals"
          TRADEMARK = "Amazon and the Amazon logo are trademarks of Amazon.com, Inc. or its affiliates."

          # Page-specific SEO targets. URLs stay unchanged for SEO value.
          PAGE_SEO = {
              "index.html": {
                  "title": "Best Deals Found on Amazon Today | Black Lab Deals",
                  "h1": "Best Deals Found on Amazon Today",
                  "description": "Find the best deals found on Amazon today, updated frequently with price drops, coupons, trending products, and limited-time discounts.",
                  "intro": "Black Lab Deals helps shoppers quickly find current price drops, coupons, and limited-time discounts found on Amazon.",
                  "keywords": ["Amazon deals", "deals found on Amazon", "daily deals", "price drops"],
              },
              "top-100-amazon-deals-today/index.html": {
                  "title": "Top 100 Deals Found on Amazon Today | Updated Often",
                  "h1": "Top 100 Deals Found on Amazon Today",
                  "description": "Browse the top 100 deals found on Amazon today. Updated often with trending discounts, coupons, and current price drops.",
                  "intro": "This page highlights 100 currently active deals found on Amazon so you can scan the biggest discounts faster.",
                  "keywords": ["top 100 Amazon deals", "deals found on Amazon", "Amazon deals today"],
              },
              "best-amazon-tool-deals/index.html": {
                  "title": "Best Tool Deals Found on Amazon Today | Black Lab Deals",
                  "h1": "Best Tool Deals Found on Amazon Today",
                  "description": "Shop tool deals found on Amazon today, including power tools, hand tools, accessories, shop storage, and useful workshop finds.",
                  "intro": "We track tool price drops and discounts to help woodworkers, DIYers, and homeowners find useful tool deals faster.",
                  "keywords": ["Amazon tool deals", "tool deals", "power tool deals", "woodworking tool deals"],
              },
              "best-amazon-deals-under-50/index.html": {
                  "title": "Best Deals Under $50 Found on Amazon Today",
                  "h1": "Best Deals Under $50 Found on Amazon",
                  "description": "Find budget-friendly deals under $50 found on Amazon, including home, kitchen, tools, electronics, pet supplies, and gift ideas.",
                  "intro": "This page focuses on affordable deals under $50 so you can find useful discounts without sorting through expensive products.",
                  "keywords": ["Amazon deals under 50", "deals under $50", "budget Amazon deals"],
              },
              "best-amazon-home-kitchen-deals/index.html": {
                  "title": "Best Home & Kitchen Deals Found on Amazon Today",
                  "h1": "Best Home & Kitchen Deals Found on Amazon",
                  "description": "Browse home and kitchen deals found on Amazon today, including appliances, storage, cookware, cleaning products, and everyday home finds.",
                  "intro": "We organize current home and kitchen discounts so you can quickly find useful household deals in one place.",
                  "keywords": ["Amazon home deals", "Amazon kitchen deals", "home and kitchen deals"],
              },
              "best-amazon-electronics-deals/index.html": {
                  "title": "Best Electronics Deals Found on Amazon Today",
                  "h1": "Best Electronics Deals Found on Amazon Today",
                  "description": "Find electronics deals found on Amazon today, including tech accessories, smart home devices, headphones, chargers, and useful gadgets.",
                  "intro": "This page highlights current electronics discounts and tech deals found on Amazon.",
                  "keywords": ["Amazon electronics deals", "tech deals", "electronics deals"],
              },
              "best-amazon-pet-supplies-deals/index.html": {
                  "title": "Best Pet Supply Deals Found on Amazon Today",
                  "h1": "Best Pet Supply Deals Found on Amazon",
                  "description": "Find pet supply deals found on Amazon today, including dog supplies, cat supplies, pet grooming, toys, treats, and everyday essentials.",
                  "intro": "We track current pet supply discounts to help you save on everyday essentials for dogs, cats, and other pets.",
                  "keywords": ["Amazon pet deals", "pet supply deals", "dog deals", "cat deals"],
              },
              "best-amazon-sports-outdoors-deals/index.html": {
                  "title": "Best Sports & Outdoor Deals Found on Amazon Today",
                  "h1": "Best Sports & Outdoor Deals Found on Amazon",
                  "description": "Browse sports and outdoor deals found on Amazon today, including fitness gear, camping supplies, outdoor equipment, and recreation products.",
                  "intro": "This page collects current sports, fitness, camping, and outdoor discounts found on Amazon.",
                  "keywords": ["Amazon sports deals", "outdoor deals", "camping deals", "fitness deals"],
              },
              "amazon-coupon-deals/index.html": {
                  "title": "Coupon Deals Found on Amazon Today | Black Lab Deals",
                  "h1": "Coupon Deals Found on Amazon Today",
                  "description": "Find coupon deals found on Amazon today. Browse products with visible coupons, limited-time savings, and current discounts.",
                  "intro": "This page focuses on deals with coupons and extra savings opportunities found on Amazon.",
                  "keywords": ["Amazon coupon deals", "coupon deals", "Amazon coupons"],
              },
              "amazon-best-sellers-on-sale/index.html": {
                  "title": "Best Sellers on Sale Found on Amazon Today",
                  "h1": "Best Sellers on Sale Found on Amazon Today",
                  "description": "Browse best-selling products currently on sale and found on Amazon, organized for quick deal discovery.",
                  "intro": "This page highlights popular and best-selling products that currently show a deal or discount.",
                  "keywords": ["Amazon best sellers on sale", "best seller deals", "popular deals"],
              },
          }

          COPY_REPLACEMENTS = [
              ("Top 100 Amazon Deals Today", "Top 100 Deals Found on Amazon Today"),
              ("Top 100 Amazon deals today", "Top 100 deals found on Amazon today"),
              ("Top 100 Amazon deals", "Top 100 deals found on Amazon"),
              ("top 100 Amazon deals", "top 100 deals found on Amazon"),
              ("Today’s top 100 Amazon deals", "Today’s top 100 deals found on Amazon"),
              ("Today's top 100 Amazon deals", "Today's top 100 deals found on Amazon"),
              ("Best Amazon Tool Deals", "Best Tool Deals Found on Amazon"),
              ("Best Amazon Tools Deals", "Best Tool Deals Found on Amazon"),
              ("Best Amazon Deals Under $50", "Best Deals Under $50 Found on Amazon"),
              ("Best Amazon Home & Kitchen Deals", "Best Home & Kitchen Deals Found on Amazon"),
              ("Best Amazon Kitchen Deals", "Best Kitchen Deals Found on Amazon"),
              ("Best Amazon Electronics Deals", "Best Electronics Deals Found on Amazon"),
              ("Best Amazon Pet Supplies Deals", "Best Pet Supply Deals Found on Amazon"),
              ("Best Amazon Pet Supply Deals", "Best Pet Supply Deals Found on Amazon"),
              ("Best Amazon Sports & Outdoors Deals", "Best Sports & Outdoor Deals Found on Amazon"),
              ("Best Amazon Sports and Outdoors Deals", "Best Sports & Outdoor Deals Found on Amazon"),
              ("Amazon Deals Updated Every 30 Minutes", "Best Deals Found on Amazon — Updated Every 30 Minutes"),
              ("Amazon deals updated every 30 minutes", "deals found on Amazon, updated every 30 minutes"),
              ("Black Lab Deals tracks live Amazon price drops", "Black Lab Deals tracks live price drops found on Amazon"),
              ("Loading today’s top 100 Amazon deals", "Loading today’s top 100 deals found on Amazon"),
              ("Loading today's top 100 Amazon deals", "Loading today's top 100 deals found on Amazon"),
              ("The Best Amazon Deals We Found Right Now", "The Best Deals We Found on Amazon Right Now"),
              ("Best Amazon Deals Right Now", "Best Deals Found on Amazon Right Now"),
              ("Trending Amazon Discounts Today", "Trending Discounts Found on Amazon Today"),
              ("Newly Found Amazon Deals", "Newly Found Deals on Amazon"),
              ("Official Amazon", "Amazon"),
          ]

          FAQS = [
              ("How often are these deals updated?", "Black Lab Deals updates deal lists frequently so shoppers can review current discounts, price drops, and coupons."),
              ("Are these official Amazon rankings?", "No. These are deals found on Amazon and organized by Black Lab Deals to make shopping easier."),
              ("Do prices and coupons change?", "Yes. Prices, coupons, and availability can change quickly, so always confirm the final price on Amazon before purchasing."),
          ]

          def esc(value):
              return html.escape(value, quote=True)

          def rel_path(path: Path) -> str:
              return path.as_posix().lstrip("./")

          def page_url(rel):
              if rel == "index.html":
                  return SITE + "/"
              if rel.endswith("/index.html"):
                  return SITE + "/" + rel[:-len("index.html")]
              return SITE + "/" + rel

          def remove_existing_managed_blocks(text):
              text = re.sub(r'\n?\s*<!-- BLD SEO START -->.*?<!-- BLD SEO END -->\s*\n?', '\n', text, flags=re.S)
              text = re.sub(r'\n?\s*<!-- BLD TRUST START -->.*?<!-- BLD TRUST END -->\s*\n?', '\n', text, flags=re.S)
              return text

          def set_title(text, title):
              if re.search(r'<title>.*?</title>', text, flags=re.I|re.S):
                  return re.sub(r'<title>.*?</title>', f'<title>{esc(title)}</title>', text, count=1, flags=re.I|re.S)
              return re.sub(r'</head>', f'  <title>{esc(title)}</title>\n</head>', text, count=1, flags=re.I)

          def set_h1(text, h1):
              if re.search(r'<h1([^>]*)>.*?</h1>', text, flags=re.I|re.S):
                  return re.sub(r'<h1([^>]*)>.*?</h1>', lambda m: f'<h1{m.group(1)}>{esc(h1)}</h1>', text, count=1, flags=re.I|re.S)
              return text

          def strip_meta(text):
              patterns = [
                  r'\s*<meta\s+name=["\']description["\'][^>]*>\n?',
                  r'\s*<meta\s+name=["\']keywords["\'][^>]*>\n?',
                  r'\s*<link\s+rel=["\']canonical["\'][^>]*>\n?',
                  r'\s*<meta\s+property=["\']og:[^"\']+["\'][^>]*>\n?',
                  r'\s*<meta\s+name=["\']twitter:[^"\']+["\'][^>]*>\n?',
                  r'\s*<script\s+type=["\']application/ld\+json["\']\s+data-bld-seo=["\']true["\']>.*?</script>\n?',
              ]
              for pat in patterns:
                  text = re.sub(pat, '\n', text, flags=re.I|re.S)
              return text

          def build_schema(data, url):
              web_page = {
                  "@context": "https://schema.org",
                  "@type": "WebPage",
                  "name": data["h1"],
                  "description": data["description"],
                  "url": url,
                  "publisher": {"@type": "Organization", "name": BRAND, "url": SITE + "/"},
                  "about": ["deals", "discounts", "price drops", "Amazon shopping"],
              }
              breadcrumb = {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                      {"@type": "ListItem", "position": 1, "name": "Home", "item": SITE + "/"},
                      {"@type": "ListItem", "position": 2, "name": data["h1"], "item": url},
                  ],
              }
              faq = {
                  "@context": "https://schema.org",
                  "@type": "FAQPage",
                  "mainEntity": [
                      {"@type": "Question", "name": q, "acceptedAnswer": {"@type": "Answer", "text": a}}
                      for q, a in FAQS
                  ],
              }
              return "\n".join([
                  '<script type="application/ld+json" data-bld-seo="true">' + json.dumps(web_page, ensure_ascii=False) + '</script>',
                  '<script type="application/ld+json" data-bld-seo="true">' + json.dumps(breadcrumb, ensure_ascii=False) + '</script>',
                  '<script type="application/ld+json" data-bld-seo="true">' + json.dumps(faq, ensure_ascii=False) + '</script>',
              ])

          def build_head_block(data, url):
              keywords = ", ".join(data.get("keywords", []))
              schema = build_schema(data, url)
              return f'''<!-- BLD SEO START -->
  <meta name="description" content="{esc(data['description'])}">
  <meta name="keywords" content="{esc(keywords)}">
  <link rel="canonical" href="{esc(url)}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{BRAND}">
  <meta property="og:title" content="{esc(data['title'])}">
  <meta property="og:description" content="{esc(data['description'])}">
  <meta property="og:url" content="{esc(url)}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{esc(data['title'])}">
  <meta name="twitter:description" content="{esc(data['description'])}">
  {schema}
  <!-- BLD SEO END -->'''

          def build_trust_block(data):
              faq_html = "\n".join([f"""    <details>
      <summary>{esc(q)}</summary>
      <p>{esc(a)}</p>
    </details>""" for q, a in FAQS])
              return f'''<!-- BLD TRUST START -->
<section class="seo-info-section" aria-labelledby="how-we-find-deals">
  <h2 id="how-we-find-deals">How We Find These Deals</h2>
  <p>{esc(data['intro'])}</p>
  <p>We track price history, discounts, coupons, and trending products to help shoppers review deals found on Amazon more quickly. Deal prices and availability can change, so always confirm the final price before buying.</p>
  <h2>Deal Questions</h2>
{faq_html}
</section>
<!-- BLD TRUST END -->'''

          def insert_before_case_insensitive(text, marker, block):
              m = re.search(re.escape(marker), text, flags=re.I)
              if not m:
                  return text
              return text[:m.start()] + block + "\n" + text[m.start():]

          changed = []
          for path in sorted(Path('.').rglob('*.html')):
              if '.git' in path.parts:
                  continue
              rel = rel_path(path)
              text = path.read_text(encoding='utf-8')
              original = text
              text = remove_existing_managed_blocks(text)
              for old, new in COPY_REPLACEMENTS:
                  text = text.replace(old, new)

              data = PAGE_SEO.get(rel)
              if data:
                  url = page_url(rel)
                  text = set_title(text, data['title'])
                  text = set_h1(text, data['h1'])
                  text = strip_meta(text)
                  head_block = build_head_block(data, url)
                  if re.search(r'</head>', text, flags=re.I):
                      text = re.sub(r'</head>', head_block + '\n</head>', text, count=1, flags=re.I)

                  trust_block = build_trust_block(data)
                  if re.search(r'<footer', text, flags=re.I):
                      text = insert_before_case_insensitive(text, '<footer', trust_block)
                  elif re.search(r'</main>', text, flags=re.I):
                      text = insert_before_case_insensitive(text, '</main>', trust_block)
                  elif re.search(r'</body>', text, flags=re.I):
                      text = insert_before_case_insensitive(text, '</body>', trust_block)

              if TRADEMARK not in text:
                  trademark_html = f'<p class="amazon-trademark-note">{esc(TRADEMARK)}</p>'
                  if re.search(r'</footer>', text, flags=re.I):
                      text = re.sub(r'</footer>', '  ' + trademark_html + '\n</footer>', text, count=1, flags=re.I)
                  elif re.search(r'</body>', text, flags=re.I):
                      text = insert_before_case_insensitive(text, '</body>', '<footer class="site-footer">' + trademark_html + '</footer>')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(rel)

          # Keep sitemap URLs untouched, but refresh lastmod for listed public URLs.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              sm = sitemap.read_text(encoding='utf-8')
              orig = sm
              from datetime import date
              today = date.today().isoformat()
              urls = [page_url(p) for p in PAGE_SEO]
              for url in urls:
                  block_re = re.compile(r'(<url>\s*<loc>' + re.escape(url) + r'</loc>)(.*?)(</url>)', re.S)
                  def repl(m):
                      body = m.group(2)
                      if '<lastmod>' in body:
                          body = re.sub(r'<lastmod>.*?</lastmod>', f'<lastmod>{today}</lastmod>', body, count=1)
                      else:
                          body = body + f'\n<lastmod>{today}</lastmod>'
                      return m.group(1) + body + m.group(3)
                  sm = block_re.sub(repl, sm, count=1)
              if sm != orig:
                  sitemap.write_text(sm, encoding='utf-8')
                  changed.append('sitemap.xml')

          # Delete this one-time workflow after it applies the optimization.
          wf = Path('.github/workflows/one-time-seo-copy-updates.yml')
          if wf.exists():
              wf.unlink()
              changed.append(str(wf))

          print('Optimized files:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit optimized SEO pages
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No SEO changes to commit."
          else
            git commit -m "Optimize sitewide SEO metadata and content"
            git push
          fi
