name: Patch Homepage Bottom SEO Section

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/homepage-bottom-seo.txt'

permissions:
  contents: write

concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Remove visible homepage bottom SEO block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '<!-- BLD TRUST START -->'
          end_marker = '<!-- BLD TRUST END -->'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1:
              print('Homepage bottom SEO block was not found; no change needed')
          else:
              end += len(end_marker)
              text = text[:start].rstrip() + '\n' + text[end:].lstrip()
              path.write_text(text, encoding='utf-8')
              print('Removed visible bottom SEO block from index.html')
          PY

      - name: Commit, push, and deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f index.html
          git status
          if git diff --staged --quiet; then
            echo "No homepage SEO block changes to commit"
          else
            git commit -m "Remove visible homepage bottom SEO block"
            git push origin main
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered Vercel deploy hook"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
          fi
