name: Fetch Deals
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-deals-main
  cancel-in-progress: true
jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run deal fetcher
        env:
          KEEPA_API_KEY:              ${{ secrets.KEEPA_API_KEY }}
          AFFILIATE_TAG:              ${{ secrets.AFFILIATE_TAG }}
          CREATORS_CREDENTIAL_ID:     ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          MAILCHIMP_API_KEY:          ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER:           ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID:          ${{ secrets.MAILCHIMP_LIST_ID }}
          INTERNAL_SECRET:            ${{ secrets.INTERNAL_SECRET }}
        run: python fetch_deals.py
      - name: Render static deal cards
        run: python render_homepage_static_deals.py
      - name: Apply Amazon compliance copy updates
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Top Amazon discounts across every category — updated every 30 minutes automatically.': 'Top deals found on Amazon across every category — updated every 30 minutes automatically.',
              'Top Amazon discounts across every category - updated every 30 minutes automatically.': 'Top deals found on Amazon across every category - updated every 30 minutes automatically.',
              'Updated every 30 minutes · Powered by live Amazon data': 'Updated every 30 minutes · Deal data refreshed regularly',
              'Updated every 30 minutes &middot; Powered by live Amazon data': 'Updated every 30 minutes &middot; Deal data refreshed regularly',
              'Updated every 30 minutes • Powered by live Amazon data': 'Updated every 30 minutes • Deal data refreshed regularly',
              'Updated every 30 minutes - Powered by live Amazon data': 'Updated every 30 minutes - Deal data refreshed regularly',
              'Prices sourced live from Amazon.': 'Prices and availability are checked at time of posting and may change.',
              'As an Amazon Associate we earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
              'As an Amazon Associate I earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
          }

          for path in [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated compliance copy in {path}')
          PY
      - name: Commit, push, and deploy updated deal files
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"

          git add -f *.html || true
          git add -f */index.html || true
          git add -f deals.json || true
          git add -f deals_memory.json || true
          [ -f notified_deals.json ] && git add -f notified_deals.json || true

          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update deals $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin main

          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
            exit 0
          fi

          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Triggered Vercel deploy hook"
