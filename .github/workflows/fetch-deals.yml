name: Fetch Deals
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false
jobs:
  fetch-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests keepa numpy python-amazon-paapi
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Run deal fetcher
        env:
          KEEPA_API_KEY:              ${{ secrets.KEEPA_API_KEY }}
          AFFILIATE_TAG:              ${{ secrets.AFFILIATE_TAG }}
          CREATORS_CREDENTIAL_ID:     ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          MAILCHIMP_API_KEY:          ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER:           ${{ secrets.MAILCHIMP_SERVER }}
          MAILCHIMP_LIST_ID:          ${{ secrets.MAILCHIMP_LIST_ID }}
          INTERNAL_SECRET:            ${{ secrets.INTERNAL_SECRET }}
          PRODUCT_TTL_HOURS:          23
        run: python fetch_deals.py
      - name: Purge expired product picks
        run: python purge_expired_products.py deals.json deals_memory.json --ttl-hours 23
      - name: Render static deal cards
        run: python render_homepage_static_deals.py
      - name: Apply Amazon compliance copy updates
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'Top Amazon discounts across every category — updated every 30 minutes automatically.': 'Top product picks found on Amazon across every category.',
              'Top Amazon discounts across every category - updated every 30 minutes automatically.': 'Top product picks found on Amazon across every category.',
              'Updated every 30 minutes · Powered by live Amazon data': 'Product information refreshed regularly',
              'Updated every 30 minutes &middot; Powered by live Amazon data': 'Product information refreshed regularly',
              'Updated every 30 minutes • Powered by live Amazon data': 'Product information refreshed regularly',
              'Updated every 30 minutes - Powered by live Amazon data': 'Product information refreshed regularly',
              'Prices sourced live from Amazon.': 'Prices and availability are checked at time of posting and may change.',
              'As an Amazon Associate we earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
              'As an Amazon Associate I earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
          }

          for path in [p for p in Path('.').rglob('*.html') if '.git' not in p.parts]:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated compliance copy in {path}')
          PY
      - name: Run safe wording scan
        run: python scripts/safe_wording_scan.py
      - name: Commit and push updated product files
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"

          git add -f deals.json || true
          git add -f deals_memory.json || true
          [ -f notified_deals.json ] && git add -f notified_deals.json || true

          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update product picks $(date -u '+%Y-%m-%d %H:%M UTC')"

          pushed=false
          for attempt in 1 2 3; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push failed because main moved; rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
          done

          if [ "$pushed" != "true" ]; then
            echo "Could not push product update after retries"
            exit 1
          fi

          echo "Pushed updated product data. Vercel auto-deploys are disabled in vercel.json, so this does not trigger a site rebuild."
