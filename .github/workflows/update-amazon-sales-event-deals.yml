name: Update Amazon Sales Event Deals

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blacklabdeals-sales-event-writer
  cancel-in-progress: false

jobs:
  update-amazon-sales-event-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests keepa numpy python-amazon-paapi

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Fetch Amazon Sales Event deals
        env:
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          AFFILIATE_TAG: blacklabdealsprime-20
          AMAZON_SALES_EVENT_SHEET_ID: 19xrjgm9FJdiJaptD7iO2cMzxLFk5LbqivvgvaGZ3qsI
          AMAZON_SALES_EVENT_SHEET_GID: '0'
        run: python fetch_amazon_sales_event_deals.py

      - name: Commit updated feed
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f amazon-sales-event-deals.json
          git status
          if git diff --staged --quiet; then
            echo "No feed changes to commit."
            exit 0
          fi
          git commit -m "Update Amazon Sales Event feed"
          git push origin main
