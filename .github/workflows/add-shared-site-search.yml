name: Add Shared Site Search
on:
  push:
    paths:
      - '.github/workflows/add-shared-site-search.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: add-shared-site-search
  cancel-in-progress: true
jobs:
  add-shared-search:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add shared nav search and search results page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          header = Path('site-header.js')
          text = header.read_text(encoding='utf-8')
          original = text

          search_css = r'''
    .bld-header-search-row{background:var(--surface,#fff);border-top:1px solid var(--border,#e8e6e1);border-bottom:1px solid var(--border,#e8e6e1);padding:12px 24px 14px;}
    .bld-header-search{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;}
    .bld-header-search input{width:100%;height:44px;border:1px solid var(--border,#e8e6e1);border-radius:999px;background:var(--bg,#f9f8f5);color:var(--text-primary,#1a1a18);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;padding:0 18px;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.04);}
    .bld-header-search input:focus{border-color:var(--accent,#1a3a5c);box-shadow:0 0 0 3px rgba(26,58,92,.12);}
    .bld-header-search input::placeholder{color:var(--text-muted,#9e9e97);}
    .bld-header-search button{height:44px;border:0;border-radius:999px;background:var(--accent,#1a3a5c);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:900;padding:0 18px;cursor:pointer;white-space:nowrap;}
    .bld-header-search button:hover{background:var(--accent-mid,#2a5a8c);}
    @media (max-width:700px){.bld-header-search-row{padding:10px 14px 12px;}.bld-header-search{gap:8px;}.bld-header-search input{height:42px;font-size:15px;}.bld-header-search button{height:42px;padding:0 14px;font-size:13px;}}
'''

          if 'bld-header-search-row' not in text:
              text = text.replace('  const MOBILE_DRAWER_CSS = `\n', '  const MOBILE_DRAWER_CSS = `\n' + search_css + '\n', 1)

          search_html = '''
        <div class="bld-header-search-row">
          <form class="bld-header-search" action="/search.html" method="get" role="search">
            <input type="search" name="q" placeholder="Search Here" aria-label="Search all Black Lab Deals">
            <button type="submit">Search</button>
          </form>
        </div>'''

          if 'action="/search.html"' not in text:
              text = text.replace('''        </div>\n        ${MOBILE_DRAWER_HTML}\n      </header>''', '''        </div>''' + search_html + '''\n        ${MOBILE_DRAWER_HTML}\n      </header>''', 1)

          if text != original:
              header.write_text(text, encoding='utf-8')
              print('Updated site-header.js with shared search bar')
          else:
              print('site-header.js already has shared search bar')

          search_page = r'''<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Amazon Deals | Black Lab Deals</title>
<meta name="description" content="Search all Black Lab Deals pages for Amazon deals, price drops, best sellers, tool deals, home and kitchen deals, and more.">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f9f8f5;--surface:#fff;--border:#e8e6e1;--text-primary:#1a1a18;--text-secondary:#6b6b65;--text-muted:#9e9e97;--accent:#1a3a5c;--accent-light:#e8eef5;--accent-mid:#2a5a8c;--gold:#c9a84c;--red:#c94040;--shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;font-size:15px;line-height:1.6}.page{max-width:1120px;margin:0 auto;padding:34px 24px 60px}.hero{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:var(--shadow);margin-bottom:24px}h1{font-family:'Playfair Display',serif;font-size:clamp(32px,4vw,52px);line-height:1.05;letter-spacing:-.03em;margin-bottom:10px}.hero p{color:var(--text-secondary);font-size:16px;max-width:720px}.search-box{display:flex;gap:10px;margin-top:22px;max-width:720px}.search-box input{flex:1;height:50px;border:1px solid var(--border);border-radius:999px;background:var(--bg);padding:0 18px;font-size:16px;font-weight:700;color:var(--text-primary);outline:none}.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,58,92,.12)}.search-box button{height:50px;border:0;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:900;padding:0 22px;cursor:pointer}.status{font-size:14px;color:var(--text-secondary);margin:0 0 16px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:100%;transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.10)}.img{height:170px;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}.img img{width:100%;height:100%;object-fit:contain;padding:12px}.body{padding:14px}.title{font-size:14px;line-height:1.35;font-weight:900;margin-bottom:9px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.meta{font-size:12px;color:var(--text-muted);margin-bottom:8px;font-weight:700}.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.now{font-size:20px;font-weight:900;color:var(--red)}.was{font-size:13px;color:var(--text-muted);text-decoration:line-through}.badge{display:inline-flex;margin-top:10px;background:#fff3d4;color:#7a5200;border:1px solid #e8c96a;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:900}.empty{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;color:var(--text-secondary)}.sources{font-size:12px;color:var(--text-muted);margin-top:14px}.disclosure{font-size:11px;color:var(--text-muted);text-align:center;margin-top:40px}@media(max-width:640px){.page{padding:22px 16px 44px}.hero{padding:22px}.search-box{flex-direction:column}.search-box button{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="site-header"></div>
<main class="page">
  <section class="hero">
    <h1>Search Black Lab Deals</h1>
    <p>Search all current deal data for Amazon deals, best sellers, price drops, tools, home and kitchen, electronics, and more.</p>
    <form class="search-box" id="searchForm" action="/search.html" method="get">
      <input id="searchInput" name="q" type="search" placeholder="Search Here" aria-label="Search all deals">
      <button type="submit">Search</button>
    </form>
  </section>
  <div id="status" class="status">Loading deals…</div>
  <section id="results" class="grid" aria-live="polite"></section>
  <div id="sources" class="sources"></div>
  <p class="disclosure">As an Amazon Associate, Black Lab Deals earns from qualifying purchases. Prices and availability may change.</p>
</main>
<script src="/site-header.js" defer></script>
<script>
(function(){
  const input=document.getElementById('searchInput');
  const statusEl=document.getElementById('status');
  const resultsEl=document.getElementById('results');
  const sourcesEl=document.getElementById('sources');
  const params=new URLSearchParams(location.search);
  const q=(params.get('q')||'').trim();
  input.value=q;

  const DATA_SOURCES=['/deals.json','/best-seller-deals.json','/best_seller_deals.json','/top-100-deals.json','/top100.json','/products.json','/search-index.json'];
  const PAGE_SOURCES=['/','/top-100-amazon-deals-today/','/best-seller-deals.html','/best-amazon-tool-deals/','/best-amazon-home-kitchen-deals/','/best-amazon-deals-under-50/','/best-amazon-electronics-deals/','/best-amazon-automotive-deals/','/best-amazon-patio-lawn-garden-deals/','/best-amazon-sports-outdoors-deals/','/best-amazon-pet-supplies-deals/','/best-amazon-toys-games-deals/','/best-amazon-office-products-deals/','/best-amazon-health-household-deals/'];

  function money(v){if(v==null||v==='')return'';const n=Number(String(v).replace(/[^0-9.]/g,''));return Number.isFinite(n)&&n>0?'$'+n.toFixed(2):String(v)}
  function first(...vals){return vals.find(v=>v!==undefined&&v!==null&&String(v).trim()!=='')||''}
  function imageOf(d){return first(d.image,d.imageUrl,d.image_url,d.img,d.thumbnail,d.imageLarge,d.imageMedium,d.productImage,d.product_image)}
  function titleOf(d){return first(d.title,d.name,d.productTitle,d.product_title,d.description,d.asin,'Amazon Deal')}
  function priceOf(d){return first(d.price,d.currentPrice,d.current_price,d.nowPrice,d.salePrice,d.sale_price,d.buyBoxPrice,d.newPrice)}
  function oldPriceOf(d){return first(d.listPrice,d.list_price,d.wasPrice,d.was_price,d.originalPrice,d.original_price,d.avgPrice,d.averagePrice)}
  function urlOf(d){return first(d.url,d.link,d.affiliateUrl,d.affiliate_url,d.amazonUrl,d.amazon_url,d.detailPageURL,d.href,'#')}
  function categoryOf(d){return first(d.category,d.categoryName,d.category_name,d.department,d.group,d.page)}
  function asinOf(d){return first(d.asin,d.ASIN)}
  function normalizeArray(data){
    if(Array.isArray(data))return data;
    if(data&&Array.isArray(data.deals))return data.deals;
    if(data&&Array.isArray(data.products))return data.products;
    if(data&&Array.isArray(data.items))return data.items;
    if(data&&Array.isArray(data.results))return data.results;
    return [];
  }
  function dedupe(items){
    const seen=new Set();
    return items.filter(d=>{const key=(asinOf(d)||urlOf(d)||titleOf(d)).toLowerCase();if(seen.has(key))return false;seen.add(key);return true;});
  }
  function matches(d,query){
    if(!query)return true;
    const hay=[titleOf(d),categoryOf(d),asinOf(d),first(d.brand,d.manufacturer),JSON.stringify(d)].join(' ').toLowerCase();
    return query.toLowerCase().split(/\s+/).every(term=>hay.includes(term));
  }
  function render(items,query){
    const filtered=dedupe(items).filter(d=>matches(d,query)).slice(0,120);
    statusEl.textContent=query?`${filtered.length} result${filtered.length===1?'':'s'} for “${query}”`:`Showing latest deals`;
    if(!filtered.length){resultsEl.innerHTML='<div class="empty">No matching deals found. Try a broader search like “tools”, “kitchen”, “Ryobi”, or “storage”.</div>';return;}
    resultsEl.innerHTML=filtered.map(d=>{
      const title=titleOf(d), img=imageOf(d), url=urlOf(d), price=money(priceOf(d)), old=money(oldPriceOf(d)), cat=categoryOf(d), asin=asinOf(d);
      return `<a class="card" href="${url}" target="_blank" rel="nofollow sponsored noopener"><div class="img">${img?`<img src="${img}" alt="${title.replace(/"/g,'&quot;')}" loading="lazy">`:'🛒'}</div><div class="body"><div class="title">${title}</div><div class="meta">${[cat,asin].filter(Boolean).join(' · ')}</div><div class="price">${price?`<span class="now">${price}</span>`:''}${old?`<span class="was">${old}</span>`:''}</div><span class="badge">View Deal</span></div></a>`;
    }).join('');
  }
  async function fetchJson(url){const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(url);return normalizeArray(await res.json()).map(x=>({...x,page:url}));}
  async function fetchPageDeals(url){
    const res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(url);const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');
    const cards=[...doc.querySelectorAll('.deal-card,.hot-card,.product-card,.best-seller-card,[data-asin]')];
    return cards.map(card=>{const a=card.querySelector('a[href]')||card.closest('a[href]');const img=card.querySelector('img');const titleEl=card.querySelector('.deal-title,.hot-card-title,.product-title,.title,h2,h3')||card;const priceEl=card.querySelector('.price,.deal-price,.hot-price-now,.now');return {title:(titleEl.textContent||'').trim(),url:a?a.href:url,image:img?img.src:'',price:priceEl?(priceEl.textContent||'').trim():'',category:url,page:url,asin:card.getAttribute('data-asin')||''};}).filter(d=>d.title);
  }
  async function load(){
    let all=[], sources=[];
    const jsonResults=await Promise.allSettled(DATA_SOURCES.map(fetchJson));
    jsonResults.forEach((r,i)=>{if(r.status==='fulfilled'&&r.value.length){all=all.concat(r.value);sources.push(DATA_SOURCES[i]);}});
    if(all.length<10){
      const pageResults=await Promise.allSettled(PAGE_SOURCES.map(fetchPageDeals));
      pageResults.forEach((r,i)=>{if(r.status==='fulfilled'&&r.value.length){all=all.concat(r.value);sources.push(PAGE_SOURCES[i]);}});
    }
    sourcesEl.textContent=sources.length?'Searched sources: '+sources.join(', '):'';
    if(!all.length){statusEl.textContent='No deal data loaded yet.';resultsEl.innerHTML='<div class="empty">The search page is ready, but no searchable deal feed was found. Once deal JSON or deal cards are available, results will appear here.</div>';return;}
    render(all,q);
  }
  load().catch(err=>{statusEl.textContent='Search could not load deal data.';resultsEl.innerHTML='<div class="empty">There was a problem loading the deal results. Please try again.</div>';console.error(err);});
})();
</script>
</body>
</html>
'''
          Path('search.html').write_text(search_page, encoding='utf-8')
          print('Wrote search.html')
          PY
      - name: Commit shared search
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f site-header.js search.html
          git status
          if git diff --staged --quiet; then
            echo "No shared search changes to commit"
            exit 0
          fi
          git commit -m "Add shared navigation search across deal pages"
          git push origin main
