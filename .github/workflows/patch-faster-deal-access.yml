name: Patch Faster Deal Access

on:
  workflow_dispatch:
  push:
    paths:
      - patch_faster_deal_access.py
      - .github/workflows/patch-faster-deal-access.yml
      - patch-faster-deal-access.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch faster deal access layout
        run: python patch_faster_deal_access.py
      - name: Commit faster deal access layout
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add site-common.js site-common.css site-nav.css index.html
          git status
          if git diff --staged --quiet; then
            echo "No faster deal access changes to commit"
            exit 0
          fi
          git commit -m "Move deal cards higher on pages"
          git pull --rebase origin main
          git push origin main
