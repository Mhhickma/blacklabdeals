name: Patch popular category navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/popular-category-nav.txt'

permissions:
  contents: write

concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Improve shared popular category navigation
        run: python .github/scripts/patch-current-category-nav.py

      - name: Commit, push, and deploy navigation update
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f site-common.js site-common.css
          git status
          if git diff --staged --quiet; then
            echo "No popular category nav changes to commit"
          else
            git pull --rebase origin main
            git commit -m "Improve popular category navigation current state"
            git push origin main
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered Vercel deploy hook"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
          fi
