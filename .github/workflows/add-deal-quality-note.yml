name: Add deal quality note

on:
  push:
    paths:
      - '.github/workflows/add-deal-quality-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add note
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')

          s=s.replace('<div class="note"><strong>Live sale deals:</strong> Only products with a current price returned by the Amazon Creators API are displayed.</div>', '')
          s=s.replace('<div class="disclosure"><strong>As an Amazon Associate, Black Lab Deals earns from qualifying purchases.</strong></div>', '')
          s=s.replace('<div class="disclosure">Prices shown were returned by the Amazon Creators API and can change at any time. Check Amazon for the current price, availability, and promotion terms before purchasing.</div>', '')
          s=s.replace('<section class="hero"><h1>Amazon Sale Event Product Picks</h1><p>Browse preselected sale products. Fresh pricing appears after verification through the Amazon Creators API.</p></section>', '<section class="hero"><h1>Amazon Sale Event Product Picks</h1></section>')

          note='<section class="deal-quality-note" aria-labelledby="deal-quality-title" style="display:grid;gap:14px;border:1px solid #d9e2eb;border-radius:18px;background:#fff;padding:18px;margin:4px 0 22px;color:#24354a;box-shadow:0 5px 18px #0000000a"><div><p class="selection-kicker" style="margin:0 0 4px;color:#1a3a5c;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase">Curated sale list</p><h2 id="deal-quality-title" style="margin:0 0 8px;font:700 26px/1.15 Georgia,serif;color:#1a1a18">How These Deals Were Selected</h2><p style="margin:0;color:#595954">We use price history, sale-planning data, and hands-on deal-finding experience to narrow a very large Amazon product pool into a more useful list to browse.</p></div><div class="selection-stats" aria-label="Deal selection summary" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><div class="selection-stat" style="border:1px solid #e8e6e1;border-radius:14px;background:#f9f8f5;padding:12px"><strong style="display:block;color:#1a3a5c;font-size:20px;line-height:1">1,000,000+</strong><span style="display:block;margin-top:5px;color:#595954;font-size:12px;font-weight:700">potential products reviewed</span></div><div class="selection-stat" style="border:1px solid #e8e6e1;border-radius:14px;background:#f9f8f5;padding:12px"><strong style="display:block;color:#1a3a5c;font-size:20px;line-height:1">222,221</strong><span style="display:block;margin-top:5px;color:#595954;font-size:12px;font-weight:700">items selected for this sale list</span></div><div class="selection-stat" style="border:1px solid #e8e6e1;border-radius:14px;background:#f9f8f5;padding:12px"><strong style="display:block;color:#1a3a5c;font-size:20px;line-height:1">Amazon API</strong><span style="display:block;margin-top:5px;color:#595954;font-size:12px;font-weight:700">current prices checked before display</span></div></div><div class="value-callout" style="border:2px solid #1a3a5c;border-radius:14px;background:#eef4fa;padding:13px 15px;color:#0f2f4e;font-size:16px;font-weight:900;line-height:1.35">We track these prices throughout the year and only display products that are at or below their year-to-date lowest price.<span style="display:block;margin-top:3px;color:#4f6275;font-size:12px;font-weight:700">Prices can still change quickly, so always confirm final details on Amazon.</span></div><ul style="margin:0;padding-left:20px"><li style="margin:5px 0;color:#24354a">As an Amazon Associate, Black Lab Deals earns from qualifying purchases.</li><li style="margin:5px 0;color:#24354a">Products with displayed prices have been checked against our sale-planning data.</li><li style="margin:5px 0;color:#24354a">Prices, coupons, availability, and promotions can change quickly.</li><li style="margin:5px 0;color:#24354a">Always confirm the final price, coupon status, and availability directly on Amazon before purchasing.</li></ul></section>'
          s=re.sub(r'<section class="deal-quality-note" aria-labelledby="deal-quality-title".*?</section>', '', s, flags=re.S)
          about_marker='<section class="about" aria-labelledby="about-title">'
          if about_marker not in s:
              raise SystemExit('about marker not found')
          s=s.replace(about_marker, note+about_marker, 1)
          path.write_text(s,encoding='utf-8')
      - name: Commit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Force selection section card styling"
          git push
