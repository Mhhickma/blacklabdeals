name: Add deal quality note

on:
  push:
    paths:
      - '.github/workflows/add-deal-quality-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add note
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')

          s=s.replace('<div class="note"><strong>Live sale deals:</strong> Only products with a current price returned by the Amazon Creators API are displayed.</div>', '')
          s=s.replace('<div class="disclosure">Prices shown were returned by the Amazon Creators API and can change at any time. Check Amazon for the current price, availability, and promotion terms before purchasing.</div>', '')

          base='.note,.disclosure{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          expanded='.note,.disclosure,.deal-quality-note{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          s=s.replace(base, expanded)
          disclosure='.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}'
          note_css='.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}.deal-quality-note{border-color:#b8d6c1;background:#f1fbf4;color:#183f25}.deal-quality-note h2{margin:0 0 6px;font:900 16px Arial}.deal-quality-note p{margin:0 0 7px}.deal-quality-note p:last-child{margin-bottom:0}'
          if '.deal-quality-note{border-color:#b8d6c1' not in s:
              s=s.replace(disclosure, note_css)

          note='<section class="deal-quality-note" aria-labelledby="deal-quality-title"><h2 id="deal-quality-title">Deal Quality Note</h2><p>Products with displayed prices have been checked against our sale-planning data. When a current Amazon API price is shown, it is at or below the lowest price in our year-to-date planning data.</p><p>Prices and availability can change quickly. Always confirm final price, coupons, and availability on Amazon before purchasing.</p></section>'
          s=re.sub(r'<section class="deal-quality-note" aria-labelledby="deal-quality-title">.*?</section>', '', s, flags=re.S)
          top_marker='<section class="hero"><h1>Amazon Sale Event Product Picks</h1>'
          if top_marker not in s:
              raise SystemExit('top hero marker not found')
          s=s.replace(top_marker, note+top_marker, 1)
          path.write_text(s,encoding='utf-8')
      - name: Commit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Remove redundant sale page notices"
          git push
