name: Add deal quality note

on:
  push:
    paths:
      - '.github/workflows/add-deal-quality-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add note
        shell: python
        run: |
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')
          s=s.replace('.note,.disclosure{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}', '.note,.disclosure,.deal-quality-note{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}')
          s=s.replace('.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}', '.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}.deal-quality-note{border-color:#b8d6c1;background:#f1fbf4;color:#183f25}.deal-quality-note h2{margin:0 0 6px;font:900 16px Arial}.deal-quality-note p{margin:0 0 7px}.deal-quality-note p:last-child{margin-bottom:0}')
          marker='<button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false">Filters &amp; Sort</button><section class="controls" id="controls">'
          note='<section class="deal-quality-note" aria-labelledby="deal-quality-title"><h2 id="deal-quality-title">Deal Quality Note</h2><p>Products with displayed prices have been checked against our sale-planning data. When a current Amazon API price is shown, it is at or below the lowest price in our year-to-date planning data.</p><p>Prices and availability can change quickly. Always confirm final price, coupons, and availability on Amazon before purchasing.</p></section>'
          if note not in s:
              if marker not in s: raise SystemExit('controls marker not found')
              s=s.replace(marker,note+marker)
          path.write_text(s,encoding='utf-8')
      - name: Commit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Add sale deal quality note"
          git push
