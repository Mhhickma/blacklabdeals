name: Add deal quality note

on:
  push:
    paths:
      - '.github/workflows/add-deal-quality-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add note
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')

          s=s.replace('<div class="note"><strong>Live sale deals:</strong> Only products with a current price returned by the Amazon Creators API are displayed.</div>', '')
          s=s.replace('<div class="disclosure"><strong>As an Amazon Associate, Black Lab Deals earns from qualifying purchases.</strong></div>', '')
          s=s.replace('<div class="disclosure">Prices shown were returned by the Amazon Creators API and can change at any time. Check Amazon for the current price, availability, and promotion terms before purchasing.</div>', '')
          s=s.replace('<section class="hero"><h1>Amazon Sale Event Product Picks</h1><p>Browse preselected sale products. Fresh pricing appears after verification through the Amazon Creators API.</p></section>', '<section class="hero"><h1>Amazon Sale Event Product Picks</h1></section>')

          base='.note,.disclosure{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          expanded='.note,.disclosure,.deal-quality-note{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          s=s.replace(base, expanded)
          s=re.sub(r'\.deal-quality-note\{.*?\.deal-quality-note li\{margin:5px 0;color:#24354a\}', '', s, flags=re.S)
          disclosure='.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}'
          note_css=disclosure+'.deal-quality-note{display:grid;gap:14px;border:1px solid #d9e2eb;border-radius:18px;background:#fff;padding:18px;margin:4px 0 22px;color:#24354a;box-shadow:0 5px 18px #0000000a}.deal-quality-note .selection-kicker{margin:0 0 4px;color:#1a3a5c;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.deal-quality-note h2{margin:0 0 8px;font:700 26px/1.15 Georgia,serif;color:#1a1a18}.deal-quality-note p{margin:0;color:#595954}.selection-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.selection-stat{border:1px solid #e8e6e1;border-radius:14px;background:#f9f8f5;padding:12px}.selection-stat strong{display:block;color:#1a3a5c;font-size:20px;line-height:1}.selection-stat span{display:block;margin-top:5px;color:#595954;font-size:12px;font-weight:700}.value-callout{border:2px solid #1a3a5c;border-radius:14px;background:#eef4fa;padding:13px 15px;color:#0f2f4e;font-size:16px;font-weight:900;line-height:1.35}.value-callout span{display:block;margin-top:3px;color:#4f6275;font-size:12px;font-weight:700}.deal-quality-note ul{margin:0;padding-left:20px}.deal-quality-note li{margin:5px 0;color:#24354a}@media(max-width:619px){.deal-quality-note{padding:14px;margin-bottom:16px}.deal-quality-note h2{font-size:23px}.selection-stats{grid-template-columns:1fr}.selection-stat{padding:10px}.value-callout{font-size:14px;padding:12px}}'
          if disclosure in s:
              s=s.replace(disclosure, note_css)
          elif '.deal-quality-note{display:grid' not in s:
              s=s.replace('</style>', note_css.replace(disclosure, '')+'</style>')

          note='<section class="deal-quality-note" aria-labelledby="deal-quality-title"><div><p class="selection-kicker">Curated sale list</p><h2 id="deal-quality-title">How These Deals Were Selected</h2><p>We use price history, sale-planning data, and hands-on deal-finding experience to narrow a very large Amazon product pool into a more useful list to browse.</p></div><div class="selection-stats" aria-label="Deal selection summary"><div class="selection-stat"><strong>1,000,000+</strong><span>potential products reviewed</span></div><div class="selection-stat"><strong>222,221</strong><span>items selected for this sale list</span></div><div class="selection-stat"><strong>Amazon API</strong><span>current prices checked before display</span></div></div><div class="value-callout">Current Amazon API prices shown here are at or below the lowest price found in our year-to-date planning data.<span>Prices can still change quickly, so always confirm final details on Amazon.</span></div><ul><li>As an Amazon Associate, Black Lab Deals earns from qualifying purchases.</li><li>Products with displayed prices have been checked against our sale-planning data.</li><li>Prices, coupons, availability, and promotions can change quickly.</li><li>Always confirm the final price, coupon status, and availability directly on Amazon before purchasing.</li></ul></section>'
          s=re.sub(r'<section class="deal-quality-note" aria-labelledby="deal-quality-title">.*?</section>', '', s, flags=re.S)
          about_marker='<section class="about" aria-labelledby="about-title">'
          if about_marker not in s:
              raise SystemExit('about marker not found')
          s=s.replace(about_marker, note+about_marker, 1)
          path.write_text(s,encoding='utf-8')
      - name: Commit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Highlight YTD price value point"
          git push
