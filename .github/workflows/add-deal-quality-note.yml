name: Add deal quality note

on:
  push:
    paths:
      - '.github/workflows/add-deal-quality-note.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add note
        shell: python
        run: |
          import re
          from pathlib import Path
          path=Path('sale-event-review-7f3k9/index.html')
          s=path.read_text(encoding='utf-8')

          s=s.replace('<div class="note"><strong>Live sale deals:</strong> Only products with a current price returned by the Amazon Creators API are displayed.</div>', '')
          s=s.replace('<div class="disclosure">Prices shown were returned by the Amazon Creators API and can change at any time. Check Amazon for the current price, availability, and promotion terms before purchasing.</div>', '')

          base='.note,.disclosure{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          expanded='.note,.disclosure,.deal-quality-note{border:1px solid #bfd3e6;border-radius:12px;background:#f1f7fc;padding:13px 15px;margin-bottom:12px;color:#173b60}'
          s=s.replace(base, expanded)
          disclosure='.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}'
          note_css='.disclosure{border-color:#d9c376;background:#fff9e8;color:#574a24}.deal-quality-note{border-color:#b8d6c1;background:#f1fbf4;color:#183f25}.deal-quality-note h2{margin:0 0 6px;font:900 16px Arial}.deal-quality-note p{margin:0 0 7px}.deal-quality-note p:last-child{margin-bottom:0}.deal-quality-note ul{margin:0;padding-left:20px}.deal-quality-note li{margin:5px 0}'
          if '.deal-quality-note{border-color:#b8d6c1' not in s:
              s=s.replace(disclosure, note_css)
          elif '.deal-quality-note ul{' not in s:
              s=s.replace('.deal-quality-note p:last-child{margin-bottom:0}', '.deal-quality-note p:last-child{margin-bottom:0}.deal-quality-note ul{margin:0;padding-left:20px}.deal-quality-note li{margin:5px 0}')

          note='<section class="deal-quality-note" aria-labelledby="deal-quality-title"><h2 id="deal-quality-title">How These Deals Were Selected</h2><ul><li>We started with over 1,000,000 potential products.</li><li>Using price history, sale-planning data, and hands-on deal-finding experience, we narrowed that list down to 222,221 items we believe offer the best value.</li><li>Products with displayed prices have been checked against our sale-planning data.</li><li>When a current Amazon API price is shown, it is at or below the lowest price found in our year-to-date planning data.</li><li>Prices, coupons, availability, and promotions can change quickly.</li><li>Always confirm the final price, coupon status, and availability directly on Amazon before purchasing.</li></ul></section>'
          s=re.sub(r'<section class="deal-quality-note" aria-labelledby="deal-quality-title">.*?</section>', '', s, flags=re.S)
          top_marker='<section class="hero"><h1>Amazon Sale Event Product Picks</h1>'
          if top_marker not in s:
              raise SystemExit('top hero marker not found')
          s=s.replace(top_marker, note+top_marker, 1)
          path.write_text(s,encoding='utf-8')
      - name: Commit note
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sale-event-review-7f3k9/index.html
          git diff --cached --quiet || git commit -m "Update sale deal selection note"
          git push
