name: Fetch Best Seller Deals

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blacklabdeals-main-writer
  cancel-in-progress: false

jobs:
  fetch-best-seller-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests keepa numpy python-amazon-paapi

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run best seller deal fetcher
        env:
          KEEPA_API_KEY:              ${{ secrets.KEEPA_API_KEY }}
          AFFILIATE_TAG:              ${{ secrets.AFFILIATE_TAG }}
          CREATORS_CREDENTIAL_ID:     ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          BEST_SELLER_ASINS_PER_RUN:  125
          BEST_SELLER_REFRESH_WATCHLIST: false
          BEST_SELLER_PRODUCT_TTL_HOURS: 23
        run: python fetch_best_seller_deals.py

      - name: Purge expired best seller product picks
        run: python purge_expired_products.py best_seller_deals.json --ttl-hours 23

      - name: Patch homepage navigation
        run: python patch_homepage_nav.py

      - name: Patch best seller page navigation to shared nav
        run: python patch_best_seller_shared_nav.py

      - name: Commit and push updated best seller deal files
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"

          git add -f best_seller_categories.json || true
          git add -f best_seller_watchlist.json || true
          git add -f best_seller_state.json || true
          git add -f best_seller_deals.json || true
          git add -f index.html || true
          git add -f best-seller-deals.html || true
          git add -f shared-navigation.js || true

          git status

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update best seller deals $(date -u '+%Y-%m-%d %H:%M UTC')"

          pushed=false
          for attempt in 1 2 3; do
            if git push origin main; then
              pushed=true
              break
            fi
            echo "Push failed because main moved; rebasing and retrying ($attempt/3)"
            git fetch origin main
            git rebase origin/main
          done

          if [ "$pushed" != "true" ]; then
            echo "Could not push best seller deal update after retries"
            exit 1
          fi

          echo "Pushed updated best seller product data. Vercel auto-deploys are disabled in vercel.json, so this does not trigger a site rebuild."
