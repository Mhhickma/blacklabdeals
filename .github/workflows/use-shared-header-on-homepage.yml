name: Use Shared Header On Homepage
on:
  push:
    paths:
      - '.github/workflows/use-shared-header-on-homepage.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: use-shared-header-on-homepage
  cancel-in-progress: true
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace hard-coded homepage header with shared header
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          shared_header = '<div id="site-header"></div>\n<script src="/site-header.js"></script>'

          # Replace the homepage-only hard-coded header with the same shared header used on the other pages.
          text, header_count = re.subn(
              r'<header class="bld-header-shell">[\s\S]*?</header>',
              shared_header,
              text,
              count=1,
          )
          print(f'Replaced hard-coded homepage header blocks: {header_count}')

          # The old homepage JS tried to fill the old blank #menu-categories dropdown.
          # Once site-header.js owns that menu, skip this old filler so it does not mutate the shared menu.
          text = text.replace(
              "const menuCats = document.getElementById('menu-categories');\nCATEGORIES.forEach((cat, i) => {",
              "const menuCats = document.getElementById('menu-categories');\nif (menuCats && !document.getElementById('site-header')) {\nCATEGORIES.forEach((cat, i) => {"
          )
          text = text.replace(
              "  menuCats.appendChild(btn);\n});\n\nconst drawerCatList",
              "  menuCats.appendChild(btn);\n});\n}\n\nconst drawerCatList"
          )

          # Keep the earlier Amazon compliance copy updates on the homepage too.
          replacements = {
              'Top Amazon discounts across every category &mdash; updated every 30 minutes automatically.': 'Top deals found on Amazon across every category &mdash; updated every 30 minutes automatically.',
              'Top Amazon discounts across every category — updated every 30 minutes automatically.': 'Top deals found on Amazon across every category — updated every 30 minutes automatically.',
              'Top Amazon discounts across every category - updated every 30 minutes automatically.': 'Top deals found on Amazon across every category - updated every 30 minutes automatically.',
              'Updated every 30 minutes &middot; Powered by live Amazon data': 'Updated every 30 minutes &middot; Deal data refreshed regularly',
              'Updated every 30 minutes · Powered by live Amazon data': 'Updated every 30 minutes · Deal data refreshed regularly',
              'Updated every 30 minutes • Powered by live Amazon data': 'Updated every 30 minutes • Deal data refreshed regularly',
              'Updated every 30 minutes - Powered by live Amazon data': 'Updated every 30 minutes - Deal data refreshed regularly',
              'Prices sourced live from Amazon.': 'Prices and availability are checked at time of posting and may change.',
              'As an Amazon Associate we earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
              'As an Amazon Associate I earn from qualifying purchases.': 'As an Amazon Associate, Black Lab Deals earns from qualifying purchases.',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          if text == original:
              print('No changes were needed in index.html')
          else:
              path.write_text(text, encoding='utf-8')
              print('Updated index.html to use /site-header.js')
          PY
      - name: Commit homepage shared header update
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f index.html
          git status
          if git diff --staged --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "Use shared header on homepage"
          git push origin main
