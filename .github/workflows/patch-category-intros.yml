name: Patch category intro sections

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/triggers/category-intros.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add category-specific intro sections
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re

          pages = {
              'top-100-amazon-deals-today/index.html': {
                  'id': 'top-100',
                  'heading': 'About Today\'s Top 100 Amazon Deals',
                  'paragraphs': [
                      'This page highlights 100 current deals found on Amazon, ranked from the Black Lab Deals feed so shoppers can scan strong discounts, coupons, and price drops in one place.',
                      'The list is refreshed regularly and mixes popular categories such as tools, home goods, electronics, office products, outdoor gear, toys, and everyday household finds.'
                  ]
              },
              'best-amazon-tool-deals/index.html': {
                  'id': 'tools',
                  'heading': 'About These Amazon Tool Deals',
                  'paragraphs': [
                      'Black Lab Deals tracks tool deals found on Amazon, including hand tools, power tools, shop storage, work gloves, measuring tools, and useful home improvement finds.',
                      'This page is built for shoppers who want to scan current workshop and DIY discounts without digging through broad Amazon search results.'
                  ]
              },
              'best-amazon-home-kitchen-deals/index.html': {
                  'id': 'home-kitchen',
                  'heading': 'About These Home & Kitchen Deals',
                  'paragraphs': [
                      'This page collects home and kitchen deals found on Amazon, including cookware, small appliances, storage, bedding, cleaning supplies, and everyday household upgrades.',
                      'Black Lab Deals refreshes this page regularly so shoppers can compare current discounts on practical items for cooking, organizing, cleaning, and making the home easier to run.'
                  ]
              },
              'best-amazon-deals-under-50/index.html': {
                  'id': 'under-50',
                  'heading': 'About These Amazon Deals Under $50',
                  'paragraphs': [
                      'This page focuses on Amazon deals under $50 so shoppers can find useful discounts without sorting through expensive products or oversized bundles.',
                      'The list includes budget-friendly finds across home, tools, electronics, office, toys, outdoor gear, and everyday essentials, with prices and availability checked at posting time.'
                  ]
              },
              'best-amazon-electronics-deals/index.html': {
                  'id': 'electronics',
                  'heading': 'About These Amazon Electronics Deals',
                  'paragraphs': [
                      'Black Lab Deals tracks electronics deals found on Amazon, including chargers, headphones, smart home devices, computer accessories, audio gear, and useful tech gadgets.',
                      'This page is meant for shoppers who want current electronics discounts without scrolling through unrelated products or expired-looking listings.'
                  ]
              },
              'best-amazon-automotive-deals/index.html': {
                  'id': 'automotive',
                  'heading': 'About These Amazon Automotive Deals',
                  'paragraphs': [
                      'This page gathers automotive deals found on Amazon, including car care, garage accessories, tools, replacement parts, cleaning supplies, and vehicle organization products.',
                      'Black Lab Deals refreshes the list so drivers and DIY garage shoppers can quickly compare current discounts before checking the final price on Amazon.'
                  ]
              },
              'best-amazon-baby-products-deals/index.html': {
                  'id': 'baby-products',
                  'heading': 'About These Amazon Baby Product Deals',
                  'paragraphs': [
                      'This page highlights baby product deals found on Amazon, including nursery basics, feeding items, diapers, bath products, travel accessories, and everyday family supplies.',
                      'Because baby product prices and availability can change quickly, each deal should be confirmed on Amazon before purchase.'
                  ]
              },
              'best-amazon-health-household-deals/index.html': {
                  'id': 'health-household',
                  'heading': 'About These Health & Household Deals',
                  'paragraphs': [
                      'Black Lab Deals tracks health and household deals found on Amazon, including cleaning supplies, personal care items, wellness basics, paper goods, and recurring home essentials.',
                      'This page helps shoppers scan practical discounts on frequently used products while still confirming the final price and quantity on Amazon.'
                  ]
              },
              'best-amazon-musical-instruments-deals/index.html': {
                  'id': 'musical-instruments',
                  'heading': 'About These Musical Instrument Deals',
                  'paragraphs': [
                      'This page collects musical instrument deals found on Amazon, including accessories, strings, stands, audio gear, practice tools, and beginner-friendly music equipment.',
                      'Black Lab Deals refreshes the page regularly so musicians, parents, and hobbyists can spot current discounts before comparing details on Amazon.'
                  ]
              },
              'best-amazon-office-products-deals/index.html': {
                  'id': 'office-products',
                  'heading': 'About These Office Product Deals',
                  'paragraphs': [
                      'This page tracks office product deals found on Amazon, including desk supplies, organization tools, printer accessories, school supplies, shipping materials, and workspace upgrades.',
                      'It is designed for shoppers who want to find current office discounts quickly, whether they are restocking a home office, classroom, or small business workspace.'
                  ]
              },
              'best-amazon-patio-lawn-garden-deals/index.html': {
                  'id': 'patio-lawn-garden',
                  'heading': 'About These Patio, Lawn & Garden Deals',
                  'paragraphs': [
                      'Black Lab Deals tracks patio, lawn, and garden deals found on Amazon, including outdoor tools, planters, yard care items, patio accessories, lighting, and seasonal outdoor supplies.',
                      'This page helps shoppers scan current outdoor discounts before checking product details, delivery timing, and final pricing on Amazon.'
                  ]
              },
              'best-amazon-pet-supplies-deals/index.html': {
                  'id': 'pet-supplies',
                  'heading': 'About These Pet Supply Deals',
                  'paragraphs': [
                      'This page gathers pet supply deals found on Amazon, including dog and cat products, grooming tools, toys, feeding accessories, beds, cleaning items, and everyday pet essentials.',
                      'Black Lab Deals keeps this list focused on current discounts so pet owners can compare useful finds before confirming price and availability on Amazon.'
                  ]
              },
              'best-amazon-sports-outdoors-deals/index.html': {
                  'id': 'sports-outdoors',
                  'heading': 'About These Sports & Outdoors Deals',
                  'paragraphs': [
                      'This page highlights sports and outdoors deals found on Amazon, including fitness gear, camping supplies, outdoor accessories, hydration items, and recreational equipment.',
                      'The list is refreshed regularly to help shoppers find current discounts for workouts, travel, camping, and outdoor projects.'
                  ]
              },
              'best-amazon-toys-games-deals/index.html': {
                  'id': 'toys-games',
                  'heading': 'About These Toys & Games Deals',
                  'paragraphs': [
                      'This page collects toys and games deals found on Amazon, including board games, building sets, learning toys, outdoor toys, puzzles, and giftable kids products.',
                      'Black Lab Deals refreshes this list so shoppers can scan current toy discounts for birthdays, holidays, classrooms, and everyday family fun.'
                  ]
              },
          }

          start = '<!-- BLD CATEGORY INTRO START -->'
          end = '<!-- BLD CATEGORY INTRO END -->'

          def section(config):
              heading = html.escape(config['heading'], quote=True)
              sid = html.escape('category-intro-' + config['id'], quote=True)
              paragraphs = '\n  '.join(f'<p>{html.escape(p, quote=True)}</p>' for p in config['paragraphs'])
              return f'{start}\n<section class="category-intro-section" aria-labelledby="{sid}">\n  <h2 id="{sid}">{heading}</h2>\n  {paragraphs}\n</section>\n{end}'

          for file_name, config in pages.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              block = section(config)
              text = re.sub(rf'{re.escape(start)}.*?{re.escape(end)}', block, text, flags=re.DOTALL)
              if start not in text:
                  marker = '<div class="stats-bar">'
                  if marker not in text:
                      raise RuntimeError(f'Could not find stats bar in {path}')
                  text = text.replace(marker, block + marker, 1)
              path.write_text(text, encoding='utf-8')
              print(f'Updated category intro in {path}')

          css = Path('site-common.css')
          css_text = css.read_text(encoding='utf-8')
          intro_css = ".category-intro-section{margin:0 0 24px;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}.category-intro-section h2{font-family:'Playfair Display',serif;font-size:24px;line-height:1.2;margin-bottom:8px}.category-intro-section p{max-width:920px;color:var(--text-secondary);font-size:15px;line-height:1.7;margin-top:8px}"
          if '.category-intro-section' not in css_text:
              css.write_text(css_text + intro_css, encoding='utf-8')
              print('Added category intro CSS')
          PY

      - name: Commit, push, and deploy category intros
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "DealDrop Bot"
          git config user.email "bot@dealdrop.com"
          git add -f site-common.css */index.html
          git status
          if git diff --staged --quiet; then
            echo "No category intro changes to commit"
          else
            git commit -m "Add category-specific SEO intros"
            git push origin main
          fi
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
            echo "Triggered Vercel deploy hook"
          else
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping Vercel deploy hook"
          fi
